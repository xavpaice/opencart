# Default values for opencart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Note: The base image section is not used in the current templates
# It's kept here for future use or custom deployments
# image:
#   repository: ttl.sh/opencart
#   pullPolicy: IfNotPresent
#   tag: "2h"

imagePullSecrets: []
imagePullPolicy: IfNotPresent
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

apache:
  replicaCount: 1
  image:
    registry: proxy.replicated.com
    repository: proxy/opencart-treefrog/923411875752.dkr.ecr.us-east-1.amazonaws.com/xav-test-apache
    tag: latest
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

apacheService:
  type: NodePort
  nodePort: 30080

php:
  replicaCount: 1
  image:
    registry: proxy.replicated.com
    repository: proxy/opencart-treefrog/923411875752.dkr.ecr.us-east-1.amazonaws.com/xav-test-php
    tag: latest
  env:
    dbDriver: mysqli
    dbHostname: mysql
    dbPort: "3306"
    dbPrefix: oc_
    opencartAdminEmail: admin@example.com
    opencartHttpServer: http://localhost/
    opencartPassword: admin
    opencartUsername: admin
    timezone: UTC
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 128Mi
  containerPort: 9000

mysql:
  image:
    repository: docker.io/library/mariadb
    tag: 10.11
  env:
    database: opencart
    user: opencart
    password: opencart
    rootPassword: opencart
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
